[package]
name = "omnidiff-wasm"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# A revision on the wasm branch of the fork: upstream plus the small patch wasm needs, rebased per release.
omnidiff = { git = "https://github.com/daghoidahl/omnidiff", rev = "80d9517b", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
